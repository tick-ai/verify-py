[project]
name = "tick-verify"
version = "0.1.0"
description = "Check a Tick receipt offline, without Tick's code: a verifier written from Tick's open specification alone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tick-verify-py = "tick_verify.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tick_verify"]
